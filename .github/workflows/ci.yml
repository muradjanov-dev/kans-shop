name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets deploy.yml gate on the exact same checks instead of duplicating them.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kansshop
          POSTGRES_PASSWORD: kansshop
          POSTGRES_DB: kansshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kansshop"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENV_FILE: ${{ runner.temp }}/kans-shop-ci.env
      # tests/conftest.py creates kansshop_test itself from this URL.
      TEST_DATABASE_URL: postgresql+asyncpg://kansshop:kansshop@localhost:5432/kansshop_test
      # Settings are required-by-default; these are placeholders, never used to
      # reach Telegram (no test hits the network).
      BOT_TOKEN: "123456:CI-TOKEN"
      BOT_USERNAME: ci_bot
      WEBHOOK_SECRET: ci-secret
      WEBHOOK_URL: ""
      ADMIN_IDS: ""
      ERROR_CHANNEL_ID: ""
      ORDERS_CHANNEL_ID: ""
      REQUIRED_CHANNEL_ID: ""
      REQUIRED_CHANNEL_URL: ""
      JWT_SECRET: synthetic-ci-jwt-secret-key-at-least-32-bytes-long
      DATABASE_URL: postgresql+asyncpg://kansshop:kansshop@localhost:5432/kansshop
      DATABASE_URL_SYNC: postgresql+psycopg://kansshop:kansshop@localhost:5432/kansshop
      REDIS_URL: redis://localhost:6379/0
      MEDIA_ROOT: ${{ runner.temp }}/kans-shop-ci-public-media
      PRIVATE_MEDIA_ROOT: ${{ runner.temp }}/kans-shop-ci-private-media
      MEDIA_BASE_URL: http://127.0.0.1/media
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create isolated test configuration and media roots
        run: |
          : > "$ENV_FILE"
          mkdir -p "$MEDIA_ROOT" "$PRIVATE_MEDIA_ROOT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check app tests
          black --check app tests
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: npm run typecheck
      # Build here too: a type-clean project can still fail `vite build`, and
      # finding that out in the deploy job wastes a round trip.
      - run: npm run build
      - name: Install Chromium for browser journeys
        run: npx playwright install --with-deps chromium
      - name: Browser purchase journeys
        run: npm run test:e2e
      - name: Upload storefront visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-visual-review-${{ github.sha }}
          path: frontend/test-results/**/storefront-artifacts/*.png
          if-no-files-found: warn
